services:
  db:
    image: postgres:16-alpine
    container_name: showcase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
      POSTGRES_DB: showcase
    ports:
      - "5433:5432"
    volumes:
      - showcase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  showcase-pgdata:

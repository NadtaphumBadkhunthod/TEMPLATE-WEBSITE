# Independent from the sibling Smart City site: its own container name, its own
# named volume and port 5434 rather than 5433, so both projects' databases can
# run side by side without colliding.
services:
  db:
    image: postgres:16-alpine
    container_name: nstfair-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nstfair
      POSTGRES_PASSWORD: nstfair
      POSTGRES_DB: nstfair
    ports:
      - "5434:5432"
    volumes:
      - nstfair-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nstfair -d nstfair"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nstfair-pgdata:
